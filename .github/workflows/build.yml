name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build -j
      - run: python3 tools/selftest.py build/savebridge

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SaveBridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier la Release "latest" (push sur main)
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SaveBridge.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SaveBridge.apk --target "$GITHUB_SHA" \
            --title "SaveBridge (dernière version)" \
            --notes "Convertisseur de sauvegardes Zelda BotW Wii U <-> Switch. Installer l'APK (autoriser les sources inconnues). Build ${GITHUB_SHA::7}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
