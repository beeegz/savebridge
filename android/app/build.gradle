plugins { id "com.android.application" }

// Version = version.txt + numéro de build CI -> chaque push est une mise à jour installable
def baseVersion = rootProject.file("version.txt").text.trim()
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
def signing = new Properties()
rootProject.file("keystore/signing.properties").withInputStream { signing.load(it) }

android {
    namespace "fr.savebridge"
    compileSdk 35

    defaultConfig {
        applicationId "fr.savebridge"
        minSdk 26
        targetSdk 35
        versionCode(100 + buildNumber)
        versionName "${baseVersion}.${buildNumber}"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_static" } }
    }

    externalNativeBuild {
        cmake { path file("../../CMakeLists.txt"); version "3.22.1" }
    }

    // Clé fixe : indispensable pour installer les mises à jour par-dessus
    signingConfigs {
        release {
            storeFile rootProject.file(signing.storeFile)
            storePassword signing.storePassword
            keyAlias signing.keyAlias
            keyPassword signing.keyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }

    lint { abortOnError false; checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
